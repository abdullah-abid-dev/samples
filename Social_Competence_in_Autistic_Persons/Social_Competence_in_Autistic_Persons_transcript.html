<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Transcript</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
  #search { width: 100%; padding: .6rem .8rem; font-size: 1rem; margin: 1rem 0; box-sizing: border-box; }
  #player { width: 100%; margin: 1rem 0; }
  .hint { color: #888; font-size: .85rem; }
  .turn { padding: .5rem .7rem; border-radius: 6px; line-height: 1.5; }
  .turn:hover { background: rgba(128,128,128,.12); }
  .turn mark { background: #ffe58a; }
  .stamp { background: none; border: 0; color: #2f6fde; cursor: pointer; font: inherit;
           padding: 0; margin-right: .4rem; font-variant-numeric: tabular-nums; }
  .stamp:hover { text-decoration: underline; }
  .speaker { font-weight: 700; margin-right: .3rem; }
  .hidden { display: none; }
  .active { background: rgba(47,111,222,.15); }
</style>
</head>
<body>
  <h1>Interactive Transcript</h1>
  <input id="search" type="search" placeholder="Search the transcript...">
  <iframe id="player" width="100%" height="380" src="https://www.youtube.com/embed/4RKTJMk5JQ0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  <div id="transcript"></div>
<script>
  const TURNS = [{"id": 0, "start": 3758, "speaker": "Abdullah Abid", "stamp": "00:00:03", "text": "And what we now know is we have the benefit of long-term longitudinal research to help us understand clear priorities in educational programming for individuals with autism. And while there still rages a debate about best practices for educating children with autism, and there's a lot of passion about one methodology versus another, this research tells us that it's not so much the name of the approach, but the focus of the approach."}, {"id": 1, "start": 29730, "speaker": "Abdullah Abid", "stamp": "00:00:29", "text": "And the focus of the approach that really has come to the forefront is this notion of social competence, social communicative competence and social emotional competence. Why is that? Because for all individuals, not just individuals on the spectrum, social competence plays this major role in our ability to form relationships with other people. And it's those relationships that allow us to function happily and effectively in the communities in which we live."}, {"id": 2, "start": 55704, "speaker": "Abdullah Abid", "stamp": "00:00:55", "text": "So, to be able to hold the jobs we want, to engage in the extracurricular activities that we're interested in, and to basically participate in daily life. And it's this social communicative competence and this ability to actively engage in our lives that then translates into very important long-term outcomes such as quality of life and mental health. So, for individuals with autism, this notion of social communicative competence or social emotional competence."}, {"id": 3, "start": 84204, "speaker": "Abdullah Abid", "stamp": "00:01:24", "text": "Becoming this key priority, we need to understand as educators what really underlies those, that ability for individuals and what are the vulnerabilities that individuals with autism have that impact their social communicative competence. We know even from diagnostics, right, from the DSM V, that social communication and social interactive difficulties are part and parcel of the diagnosis of individuals with autism on the spectrum. So we need to be able to make sure that we're supporting those areas."}, {"id": 4, "start": 114274, "speaker": "Abdullah Abid", "stamp": "00:01:54", "text": "But we also need to understand the breadth of social communicative competence and not just focus solely on the social communication piece of it."}];
  const IS_YT = true;
  const WATCH = "https://www.youtube.com/watch?v=4RKTJMk5JQ0";
  const box = document.getElementById("transcript");
  const search = document.getElementById("search");
  const player = document.getElementById("player");

  function makeSpan(turn, cls, text) {
    const s = document.createElement("span");
    s.className = cls; s.textContent = text; return s;
  }
  TURNS.forEach(turn => {
    const div = document.createElement("div");
    div.className = "turn"; div.dataset.id = turn.id; div.dataset.text = turn.text.toLowerCase();
    const btn = document.createElement("button");
    btn.className = "stamp"; btn.textContent = "[" + turn.stamp + "]";
     btn.addEventListener("click", () => {
       if (IS_YT) { window.open(WATCH + "&t=" + Math.floor(turn.start / 1000) + "s", "_blank"); }
       else if (player) { player.currentTime = turn.start / 1000; player.play(); }
     });
    div.appendChild(btn);
    if (turn.speaker) { const sp = makeSpan(turn, "speaker", turn.speaker + ":"); div.appendChild(sp); }
    div.appendChild(makeSpan(turn, "body", " " + turn.text));
    box.appendChild(div);
  });

  function highlight(div, term) {
    const body = div.querySelector(".body");
    if (!term) { body.textContent = " " + TURNS[div.dataset.id].text; return; }
    const txt = TURNS[div.dataset.id].text;
    const re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    const parts = txt.split(re);
    body.textContent = "";
    parts.forEach(p => {
      if (re.test(p)) { const m = document.createElement("mark"); m.textContent = p; body.appendChild(m); }
      else body.appendChild(document.createTextNode(p));
    });
  }

  search.addEventListener("input", () => {
    const term = search.value.trim().toLowerCase();
    document.querySelectorAll(".turn").forEach(div => {
      const match = !term || div.dataset.text.includes(term);
      div.classList.toggle("hidden", !match);
      if (match) highlight(div, term);
    });
  });

  if (player && !IS_YT) {
    player.addEventListener("timeupdate", () => {
      const t = player.currentTime * 1000;
      let cur = null;
      for (const turn of TURNS) if (turn.start <= t) cur = turn; else break;
      document.querySelectorAll(".turn").forEach(d => d.classList.toggle("active", cur && d.dataset.id == cur.id));
      if (cur) document.querySelector('.turn[data-id="' + cur.id + '"]').scrollIntoView({block: "nearest", behavior: "smooth"});
    });
  }
</script>
</body>
</html>
