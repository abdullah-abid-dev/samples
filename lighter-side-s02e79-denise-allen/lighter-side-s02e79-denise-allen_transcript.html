<script>
  const TURNS = [{"id": 0, "start": 3746, "speaker": "David Kaufer", "stamp": "00:00:03", "text": "Welcome to the lighter side of the spectrum."}, {"id": 1, "start": 5868, "speaker": "David Kaufer", "stamp": "00:00:05", "text": "The podcast that celebrates the multiple hats we wear and the juggling acts we perform in life. Whether you're parenting kids and teens on the autism spectrum, navigating the ever-evolving healthcare industry, or building a more inclusive and impactful world, this is your space to find connection, inspiration, and growth. Together, we'll share stories, tackle challenges, and explore how innovation and inclusion create better outcomes for everyone. Because no matter the spectrum, there's always a lighter side. Now here's your host."}, {"id": 2, "start": 35872, "speaker": "David Kaufer", "stamp": "00:00:35", "text": "David Coffer. Hello again, everybody. This is David Coffer. Welcome back to the lighter side of the spectrum, where we explore the people, ideas, and stone. Hi. How are you? Good. Happy. Okay, no good. And conversations that help us better understand autism, communication, and what it really means to support human potential."}, {"id": 3, "start": 65644, "speaker": "David Kaufer", "stamp": "00:01:05", "text": "You know, one of the things I've certainly learned over the last few years is that so many of the assumptions that we make about people turn out to be wrong. We've learned that what looks like a lack of understanding may actually be a motor planning challenge. We've also learned that what looks like a behavioral issue may be sensory overload. What appears to be an inability to communicate may simply be a person who hasn't been given the right way to communicate."}, {"id": 4, "start": 93922, "speaker": "David Kaufer", "stamp": "00:01:33", "text": "Today's conversation is going to ask us to consider another assumption. What if vision isn't just about seeing clearly? You know, most of us think of vision as reading, the eye chart at your doctor's office, trying to see if you have 2020 vision. You know, if you're good, you're good to go. But what if your eyes are healthy yet your brain isn't using them together in the way it's meant to be?"}, {"id": 5, "start": 122296, "speaker": "David Kaufer", "stamp": "00:02:02", "text": "What if the issue isn't how well you see, but how you see? And that's the fascinating world we're gonna step into today. And my guest today is Denise Allen, host of Healing Our Sight Podcast, and a passionate advocate for helping people better understand binocular vision and the remarkable adaptability of the human brain."}, {"id": 6, "start": 146488, "speaker": "David Kaufer", "stamp": "00:02:26", "text": "Denise spent most of her life with Strabomide Strabimus. I knew I was gonna screw it up. Well help me, Denise. Strabismus. I even practiced it. And without stereoscopic or 3D vision, like many people, she assumed that was simply the way her brain worked. But as an adult, she discovered that our visual system may be far more adaptable than many of us realize."}, {"id": 7, "start": 154210, "speaker": "Elizabeth Zielinski", "stamp": "00:02:34", "text": "business."}, {"id": 8, "start": 173484, "speaker": "David Kaufer", "stamp": "00:02:53", "text": "And that journey led her into the worlds of vision therapy, neuroplasty, developmental optometry, and neuroscience. Along the way, she's had conversations with leading experts while helping parents, patients, and professionals better understand conditions and related to vision-related challenges. So this isn't about"}, {"id": 9, "start": 197290, "speaker": "David Kaufer", "stamp": "00:03:17", "text": "Autism specifically, but we certainly see it within autism. And I think it's really gonna be a fascinating conversation because vision, sensory processing, motor planning, communication, they're all parts of an incredibly complex system. So Denise, with all that being said, thanks for joining me today. I'm really looking forward to this conversation."}, {"id": 10, "start": 216418, "speaker": "Elizabeth Zielinski", "stamp": "00:03:36", "text": "Thanks for having me."}, {"id": 11, "start": 218336, "speaker": "David Kaufer", "stamp": "00:03:38", "text": "Yeah. So why don't you tell us a little bit about your experience? What tell us about what is it like to grow up with this condition?"}, {"id": 12, "start": 229112, "speaker": "Elizabeth Zielinski", "stamp": "00:03:49", "text": "Well, you know, I didn't know anything different. So I thought I was pretty normal. But I did have struggles with coordination, being very clumsy, not very good at catching or th you know, balls or anything, any moving object coming at me was difficult to gauge where it was and catch it. So I was really bad at ball games. So I was usually chosen last, you know, that kind of thing."}, {"id": 13, "start": 257601, "speaker": "David Kaufer", "stamp": "00:04:17", "text": "Right."}, {"id": 14, "start": 258745, "speaker": "Elizabeth Zielinski", "stamp": "00:04:18", "text": "that posed a problem, of course. my knees were always scraped up, you know. I fell down. I just thought I was a clumsy kid, you know."}, {"id": 15, "start": 270074, "speaker": "David Kaufer", "stamp": "00:04:30", "text": "Yeah so you just thought you were clumsy, I mean right? Like you hear about that."}, {"id": 16, "start": 274947, "speaker": "Elizabeth Zielinski", "stamp": "00:04:34", "text": "So my mom put me in dance class. That was supposed to help. Didn't love it that much. No, it did it did help. And then I actually did gymnastics in junior high, which I shouldn't have probably been able to do very well. I was too tall for it. Wow. But yeah, that that's challenging. It's it doesn't stop someone from doing something that they want to do. My brother, who had the same condition, only his"}, {"id": 17, "start": 282072, "speaker": "David Kaufer", "stamp": "00:04:42", "text": "No."}, {"id": 18, "start": 304278, "speaker": "Elizabeth Zielinski", "stamp": "00:05:04", "text": "showed up when he was a baby. he became a basketball player. He played college basketball, which also shouldn't really be very easy. But he was passionate about basketball. Wow. So he overcame that. So I think we don't have to discount anything, right? But the thing that I found is that it can be"}, {"id": 19, "start": 327461, "speaker": "David Kaufer", "stamp": "00:05:27", "text": "Stone's very excited today. So again, he's making lots of appearances. He's getting ready to head out with his brother. That's amazing though. I mean, that he was able to play basketball. Because again, why do you I mean we'll back up a little bit and maybe kind of talk about Strabismus. Is that I get better that okay. what is it, you know, and in"}, {"id": 20, "start": 347532, "speaker": "Elizabeth Zielinski", "stamp": "00:05:47", "text": "Yeah."}, {"id": 21, "start": 353182, "speaker": "David Kaufer", "stamp": "00:05:53", "text": "How is it defined and how does it impact people?"}, {"id": 22, "start": 357292, "speaker": "Elizabeth Zielinski", "stamp": "00:05:57", "text": "Yeah, so strabismus is when the eyes don't focus together. And the easy explanation is just that they're fighting with each other all the time. And i in order to compensate for that, one of the eyes will shut off. And when you look at someone, often that eye is pointing in the another direction. Okay. Because it's getting out of the way of the other eye that's the strong eye. So you'll see."}, {"id": 23, "start": 386816, "speaker": "Elizabeth Zielinski", "stamp": "00:06:26", "text": "kids with an eye turn, right? Crossed eyes, w however you want to term it, right? It can be turning in or it can be turning out. people will call it a lazy eye."}, {"id": 24, "start": 398518, "speaker": "David Kaufer", "stamp": "00:06:38", "text": "Yeah, you hear you hear about that. Okay, so that's kind of"}, {"id": 25, "start": 403243, "speaker": "Elizabeth Zielinski", "stamp": "00:06:43", "text": "And so it it's like five percent of the population that have an actual strabismus like this. The normal population. If you're looking at the autistic spectrum, then it's to totally different. And that's just strabismus. That's not other vision problems like inability to track or other focusing types of issues like that. You know, so my"}, {"id": 26, "start": 429856, "speaker": "Elizabeth Zielinski", "stamp": "00:07:09", "text": "Mine is kind of a subset, but it's a much bigger problem than that."}, {"id": 27, "start": 434826, "speaker": "David Kaufer", "stamp": "00:07:14", "text": "Is this something that we're just like so many other things, we're just learning more about? I mean, is there just is it one that's we're just getting more awareness? Because growing up, I mean, what was like you said, you were just kind of considered maybe a little clumsy or you went in for traditional eye exams, right? Like, you know, was it just what did the eye doctors see or say, you know, and what did it take for you to finally figure it out?"}, {"id": 28, "start": 461036, "speaker": "Elizabeth Zielinski", "stamp": "00:07:41", "text": "Yeah, that is a great question. And I and I think that it's always been a problem. I just feel like the fact that we can do something about it hasn't been very obvious. So when I my brother, it was obvious at birth. He went into the doctor, they did surgery on his eyes because it was pointing way in, you know."}, {"id": 29, "start": 482882, "speaker": "David Kaufer", "stamp": "00:08:02", "text": "So it was so obvious that like they're like, Okay, we gotta fix this. I mean"}, {"id": 30, "start": 486418, "speaker": "Elizabeth Zielinski", "stamp": "00:08:06", "text": "Exactly. Yeah. And the traditional solution f when you have this kind of an eye turn is the ophthalmologist will say, Well, we're gonna do surgery. They'll do two or three surgeries. It often it takes more than one. My brother had three surgeries. Yeah, two when he was a baby and one when he was like seven to kind of tune it up. So it's kind of a lot of surgery for a young child. It doesn't teach the eyes how to work together though, to have surgery."}, {"id": 31, "start": 500245, "speaker": "David Kaufer", "stamp": "00:08:20", "text": "Oh wow."}, {"id": 32, "start": 515616, "speaker": "Elizabeth Zielinski", "stamp": "00:08:35", "text": "So even though my brother's eyes were fairly straight, he didn't learn how to see depth. My problem didn't surface until I was almost three. So it's a different type of strabismus. There's infantile like my brother, and then there's c a compensatory type of strabismus. And it usually means that you have either far sighted or nearsightedness and your eyes are not working together and they're compensating. And they put glasses on the child like they did me."}, {"id": 33, "start": 544079, "speaker": "Elizabeth Zielinski", "stamp": "00:09:04", "text": "And the eyes look pretty straight and the doctor says, Okay, you're good to go."}, {"id": 34, "start": 549136, "speaker": "David Kaufer", "stamp": "00:09:09", "text": "Just because just because your eyes are straight. Exactly."}, {"id": 35, "start": 552078, "speaker": "Elizabeth Zielinski", "stamp": "00:09:12", "text": "Exactly. And a I remember a as a child going in for my yearly exam and I was about ten and they did this test where you look in the big machine and on one side there's a note and on the other side there's the five lines for the music staff. And they said, Can you tell us what line or space that note's on?"}, {"id": 36, "start": 577300, "speaker": "Elizabeth Zielinski", "stamp": "00:09:37", "text": "And I said, Well, I see the notes over here and I see the lines over here. Do you want me to guess? And I had been guessing until then. Something just clicked and I thought and I was and I was annoyed because we I'd had a traumatic event on the way to the office. And so I think I was pr probably a little more sassy than usual, you know?"}, {"id": 37, "start": 585869, "speaker": "David Kaufer", "stamp": "00:09:45", "text": "Really?"}, {"id": 38, "start": 598594, "speaker": "David Kaufer", "stamp": "00:09:58", "text": "Yeah. A little edgy. A little edgy ten year old."}, {"id": 39, "start": 602010, "speaker": "Elizabeth Zielinski", "stamp": "00:10:02", "text": "And I just said, Do you want me to guess? Because I can't I see 'em on, you know, with each eye. And I'd had never been able to see through binoculars or, you know, the little kaleidoscope thing. The Yeah. I could never do those. and they just said, Oh, you can't do that. We won't do that anymore."}, {"id": 40, "start": 615572, "speaker": "David Kaufer", "stamp": "00:10:15", "text": "Oh yeah. Those were fun. Yeah."}, {"id": 41, "start": 625304, "speaker": "David Kaufer", "stamp": "00:10:25", "text": "That was their answer? Yeah. Oh great. That's helpful. Yeah."}, {"id": 42, "start": 630526, "speaker": "Elizabeth Zielinski", "stamp": "00:10:30", "text": "And you know, vision therapy has been around that long but nobody knew about it. I didn't know about it until I went f looking for answers as a you know, forty something year old because my eyes were bothering me more at that point."}, {"id": 43, "start": 646230, "speaker": "David Kaufer", "stamp": "00:10:46", "text": "Well, I think there's still a real lack of understanding about vision therapy. yeah, it was something I'd heard about again in our journey with autism ourselves. That's just one of many avenues that you explore when you're dealing with communication. And I remember hearing about we have a place I'm in the Seattle area, and you know, checking out, but that was all new, just the whole idea of doing vision therapy, because again, it's so"}, {"id": 44, "start": 651768, "speaker": "Elizabeth Zielinski", "stamp": "00:10:51", "text": "Absolutely."}, {"id": 45, "start": 676902, "speaker": "David Kaufer", "stamp": "00:11:16", "text": "yeah, you just think about just you just get eye exams and you get classes. You don't think about this as something another area, although it makes perfect sense once you start looking at it a little more closely."}, {"id": 46, "start": 687064, "speaker": "Elizabeth Zielinski", "stamp": "00:11:27", "text": "Right. Yeah. And I didn't start looking until my eye turn started to become really bad in my forties. I started to get presbyopia like a lot of us do at that age, you know. Can't see till you're, you know, have your hand clear out here. And so my eye turn just got worse and I looked at natural vision improvement things and I started searching online and I just by accident"}, {"id": 47, "start": 704993, "speaker": "David Kaufer", "stamp": "00:11:44", "text": "Wow."}, {"id": 48, "start": 716538, "speaker": "Elizabeth Zielinski", "stamp": "00:11:56", "text": "Not by accident, right. Came across vision therapy, found out there was a doctor just down the street from me. And there were only two in the whole state of Utah at that point. And went in and had an exam and f figured out that there was something we could do."}, {"id": 49, "start": 732536, "speaker": "David Kaufer", "stamp": "00:12:12", "text": "Wow. Well that's I'm glad that you found that. What was it like then? I mean, what and how tell me about that experience as you after you went through started going through the therapy, did you experience like true depth perception for the first time or you know, things like that?"}, {"id": 50, "start": 749652, "speaker": "Elizabeth Zielinski", "stamp": "00:12:29", "text": "Well, it wasn't quite that easy. Yeah. No. it was about two thousand thirteen. I started vision therapy, did a lot of sessions of therapy, and I just wasn't getting any solu any resolution at all. I wasn't getting any progress. And my doctor said, you know, you can look at surgery, that could be"}, {"id": 51, "start": 752305, "speaker": "David Kaufer", "stamp": "00:12:32", "text": "It wasn't like"}, {"id": 52, "start": 779468, "speaker": "Elizabeth Zielinski", "stamp": "00:12:59", "text": "What you might want to do in addition, and I didn't want to do surgery, so I stopped vision therapy, took my daughter in, found out that she was mini me and that she"}, {"id": 53, "start": 788353, "speaker": "David Kaufer", "stamp": "00:13:08", "text": "Okay. It's really genetic, it sounds like"}, {"id": 54, "start": 790562, "speaker": "Elizabeth Zielinski", "stamp": "00:13:10", "text": "Well, I knew"}, {"id": 55, "start": 794450, "speaker": "Elizabeth Zielinski", "stamp": "00:13:14", "text": "Yeah. It's hard to say. It's yeah, it's hard to say. But I mean I have six children. My youngest daughter was just like me. I knew she was like me because she had an eye turn when she was three, like I did. And I had taken her to the doctor and they put her in glasses. It was just, you know, the same process. And she was fine. She did fine in school. She didn't seem to struggle that much in other things. She didn't seem to be s super clumsy."}, {"id": 56, "start": 821804, "speaker": "Elizabeth Zielinski", "stamp": "00:13:41", "text": "I had done other things with her when she was very young, like music and movement. I taught music and movement classes. And so there were things that maybe compensated better. I don't know. And I didn't see her doing poorly in school or having any struggles. And I had this passion for sharing the whole thing, you know, because I knew it could help. I hadn't helped me yet, but I knew it could."}, {"id": 57, "start": 848576, "speaker": "Elizabeth Zielinski", "stamp": "00:14:08", "text": "And so I was reading this book called W if when your ch Sorry When Your Child Struggles by David Cook. And it had a checklist in it of things to ask the child. And I was thinking about it in relationship to c children that I was experiencing at school when I was substitute teaching. But I practice I decided to practice the questions on my daughter. And so I said I said to her, Do the words ever do this when you're reading?"}, {"id": 58, "start": 878286, "speaker": "Elizabeth Zielinski", "stamp": "00:14:38", "text": "And you know, the split apart. And she said yes. And I thought, Oh, that's not good. I had no idea that she was seeing double when she"}, {"id": 59, "start": 891072, "speaker": "David Kaufer", "stamp": "00:14:51", "text": "And how old was she at this point? Remind me. Okay, so about okay. Yeah."}, {"id": 60, "start": 893154, "speaker": "Elizabeth Zielinski", "stamp": "00:14:53", "text": "She was nine. Okay. Yeah. So very m starting to be very aware of that. And potentially have problems later on, you know, because reading just the words just keep getting smaller, right? And more difficult. so I said, Well do you ever close an eye when you're reading? That was also on the checklist. And she said, Oh yeah, ev all the time when I'm reading in bed, I s I s I lay with my eye"}, {"id": 61, "start": 900386, "speaker": "David Kaufer", "stamp": "00:15:00", "text": "Yeah."}, {"id": 62, "start": 922964, "speaker": "Elizabeth Zielinski", "stamp": "00:15:22", "text": "on the pillow so that I'm reading just with the one eye and she said and then I turn over when I turn the page and do it with the other eye."}, {"id": 63, "start": 933036, "speaker": "Elizabeth Zielinski", "stamp": "00:15:33", "text": "That was helping avoid double vision, right? And I had"}, {"id": 64, "start": 937878, "speaker": "David Kaufer", "stamp": "00:15:37", "text": "She kind of s figured it out. Like she had her own solution. I mean to exactly cope with it was a co it was a coping mechanism, basically."}, {"id": 65, "start": 945534, "speaker": "Elizabeth Zielinski", "stamp": "00:15:45", "text": "Exactly. Yes. And I don't know if she did any of that at school. Sometimes children will, you know, they'll sit with their hand up like this, you know, cover an eye. And just make other compensator compensatory items that will help them to not have that problem. So she was doing all of those things. I had no idea. And I thought I was a pretty aware mom, you know, she was child number six."}, {"id": 66, "start": 975060, "speaker": "Elizabeth Zielinski", "stamp": "00:16:15", "text": "You know, it I kind of was beating myself up a little bit about it, you know. So I took her into my vision therapy doctor and he got her in vision therapy. It took about nine months of therapy for her and she was able to gain three D."}, {"id": 67, "start": 992694, "speaker": "Elizabeth Zielinski", "stamp": "00:16:32", "text": "So it was a pretty easy process. It is something for a lot of people that you kinda have to keep doing a little bit of to keep the skill."}, {"id": 68, "start": 1004280, "speaker": "David Kaufer", "stamp": "00:16:44", "text": "Kinda like exercise in a way."}, {"id": 69, "start": 1006190, "speaker": "Elizabeth Zielinski", "stamp": "00:16:46", "text": "A little bit, yeah. So I think she might have lost a little ground. We've talked about that over the years. She's been on my podcast too and told her story. So it she recognizes that there might be some things she could do to kind of strengthen her ability still. in the meantime my daughter"}, {"id": 70, "start": 1022728, "speaker": "David Kaufer", "stamp": "00:17:02", "text": "Yeah."}, {"id": 71, "start": 1024926, "speaker": "Elizabeth Zielinski", "stamp": "00:17:04", "text": "It does. Yeah, it does. And for some people it takes way longer, you know? And there are cases that take less time. But I think nine months is a fairly standard or comfortable amount of time that it will take for people if they're if for kids, you know, kids are much more malle malleable than adults are. So oh"}, {"id": 72, "start": 1045858, "speaker": "David Kaufer", "stamp": "00:17:25", "text": "Yeah, absolutely."}, {"id": 73, "start": 1048030, "speaker": "Elizabeth Zielinski", "stamp": "00:17:28", "text": "I went back in at the end of that process. My doctor had done some training in and some other kinds of therapy. I went in, I tried those, and still wasn't getting the results I wanted. At this point, I'm like 80 sessions in division therapy. And once again, he said, You probably need to look at the surgery. So"}, {"id": 74, "start": 1073496, "speaker": "Elizabeth Zielinski", "stamp": "00:17:53", "text": "He referred me to a doctor that he's worked with. I went in, I had the strabismus surgery. Okay. So that your eyes are lined up instead of crossed."}, {"id": 75, "start": 1089452, "speaker": "David Kaufer", "stamp": "00:18:09", "text": "Wow. I mean that's a big step. I could see why you know, you would want to avoid it if at all possible. I think anytime for most of us, right, you talk about our eyes or eye surgery is just it's different. It hits different than just saying, Oh, you know, you we gotta do some elbow surgery, for example, or something like that."}, {"id": 76, "start": 1109158, "speaker": "Elizabeth Zielinski", "stamp": "00:18:29", "text": "Well, I mean when you're cutting a muscle, I j I think it's y you tend to hesitate before you're"}, {"id": 77, "start": 1116046, "speaker": "David Kaufer", "stamp": "00:18:36", "text": "It's your eyes. It's your eyes. All right. Like that's very personal to all of us. So but it sounds like it was it sounds like obviously it was a success."}, {"id": 78, "start": 1127796, "speaker": "Elizabeth Zielinski", "stamp": "00:18:47", "text": "Yeah, it was amazing. I had a really easy time with the surgery. I took like one pain med. I decided the pain meds weren't really helping me. I not doing good things to my body. Okay not doing that. And so I'm really into natural remedies. So I took this homeopathic remedy called Arnica. Oh, okay. Instead of any of the other drugs they had given me and I went back for my"}, {"id": 79, "start": 1156396, "speaker": "Elizabeth Zielinski", "stamp": "00:19:16", "text": "check up a m a week later and my eye doctor said, I can't believe how fast you've recovered from this surgery. Great, thank you. and I r that week I also went back into vision therapy. And they don't necessarily recommend that you do that. You know, a lot of times doctors will say, Oh, you should recover first or whatever. I mean I was recovered, but not everybody will go back in that quickly. And"}, {"id": 80, "start": 1163510, "speaker": "David Kaufer", "stamp": "00:19:23", "text": "Wow."}, {"id": 81, "start": 1183894, "speaker": "Elizabeth Zielinski", "stamp": "00:19:43", "text": "As soon as I went back in, I could do everything that I hadn't been able to be for."}, {"id": 82, "start": 1190178, "speaker": "David Kaufer", "stamp": "00:19:50", "text": "Wow. That must have been amazing."}, {"id": 83, "start": 1193320, "speaker": "Elizabeth Zielinski", "stamp": "00:19:53", "text": "It was. Yeah. And I gained r you know, pretty good depth perception, especially close up. My depth perceptions in normal range. Further out, it's not quite as good. So I'm still working on that."}, {"id": 84, "start": 1206614, "speaker": "David Kaufer", "stamp": "00:20:06", "text": "And I'm just curious, do you have twenty vision as well now? Or do you"}, {"id": 85, "start": 1211543, "speaker": "Elizabeth Zielinski", "stamp": "00:20:11", "text": "there's no relationship between the way that the eyes focus together and the acuity piece. Yeah. We think that vision is just all about seeing 2020. And it's not at all. So vision therapy doesn't fix that piece. Okay. I still need glasses. Okay. So I mean I wear contacts. But yeah, that piece doesn't get fixed by therapy."}, {"id": 86, "start": 1213858, "speaker": "David Kaufer", "stamp": "00:20:13", "text": "Right."}, {"id": 87, "start": 1217486, "speaker": "David Kaufer", "stamp": "00:20:17", "text": "So the vision."}, {"id": 88, "start": 1240887, "speaker": "Elizabeth Zielinski", "stamp": "00:20:40", "text": "like that. And there are other things that we can do to improve the acuity piece, but that's not typically done in a regular doctor's office. You know, that kind of goes into the realm of natural vision improvement."}, {"id": 89, "start": 1255274, "speaker": "David Kaufer", "stamp": "00:20:55", "text": "Okay. But that's remarkable that you recover that quickly. Do you attribute it to the homeopathic approach that you took or just your you know, were there other steps that you took that maybe helped accelerate it?"}, {"id": 90, "start": 1269074, "speaker": "Elizabeth Zielinski", "stamp": "00:21:09", "text": "I think that that's what I've typically attributed it to, but I also am really healthy and mindset also plays into it. The fact that I had never had a surgery before made it easier. You know, people who've had other strabismus surgeries, there's scar tissue that's gonna get in the way and it makes it a harder process."}, {"id": 91, "start": 1293976, "speaker": "David Kaufer", "stamp": "00:21:33", "text": "No, that makes a lot of sense. You know, early w you were talking about how it affects what you know, roughly five percent of the general population, but the pi the percentage is a lot higher when you're talking about the neurodiverse or the aut you know, autistic population. Do you have any estimates of how it is?"}, {"id": 92, "start": 1313140, "speaker": "Elizabeth Zielinski", "stamp": "00:21:53", "text": "I thought you might ask me that. So I pulled out this book that I like. It's called I can you see it?"}, {"id": 93, "start": 1319212, "speaker": "David Kaufer", "stamp": "00:21:59", "text": "Yeah, I guess yeah."}, {"id": 94, "start": 1320684, "speaker": "Elizabeth Zielinski", "stamp": "00:22:00", "text": "The Hidden Link Between Vision and Learning by Wendy Rosen. She's one of my podcast guests. And I knew she had told me this and that I had read it. And so I looked it up. And it says, according to her, that about 25% of children in the in the United States struggle with learning problems. And then 25% of children also have a vision problem that impedes learning. So let's see, maybe there's a connection there, right?"}, {"id": 95, "start": 1350954, "speaker": "Elizabeth Zielinski", "stamp": "00:22:30", "text": "And according to the National Center for Health Statistics, 20 to 25% of children enter school with significant vision problems. So, and that's, I mean, that's not just strubismus, that's other vision issues, right? the greatest difficulty among learning disabled children is with reading, which is affecting 75% of that population. And 80% of these children struggle with one or more visual skills."}, {"id": 96, "start": 1378520, "speaker": "David Kaufer", "stamp": "00:22:58", "text": "Wow."}, {"id": 97, "start": 1379576, "speaker": "Elizabeth Zielinski", "stamp": "00:22:59", "text": "So that's a huge number."}, {"id": 98, "start": 1382990, "speaker": "David Kaufer", "stamp": "00:23:02", "text": "That is a huge number. And I as you're talking about it, I'm thinking, you know, as it relates to the autistic and the non speaking community, is that how frustrating that must be. So, you know, because there are a lot of non speakers who have gained communication through the letter border typing or you know other methodologies."}, {"id": 99, "start": 1408886, "speaker": "David Kaufer", "stamp": "00:23:28", "text": "That that's when it finally comes out that they have vision issues. It could be double vision or you know, so similar types of issues. Of course they had no way to share that before. Right? So they're like you said, they're trying to they're trying to cope they're trying to cope with vision issues without having the way to share that, to communicate, like, hey, I'm I can't see in three D or I can't, you know, I'm seeing double of every you know, these words are all of that."}, {"id": 100, "start": 1436630, "speaker": "Elizabeth Zielinski", "stamp": "00:23:56", "text": "Yeah. Well and I mean everyone thinks that this is just the way you see. They have no idea that someone else sees differently than they do."}, {"id": 101, "start": 1445760, "speaker": "David Kaufer", "stamp": "00:24:05", "text": "Right, Like to your point, like growing up, right, growing up, you're like, oh it's just the this is just the way it is."}, {"id": 102, "start": 1453324, "speaker": "Elizabeth Zielinski", "stamp": "00:24:13", "text": "Yeah, my daughter had no idea that anyone saw any differently than she did either, you know."}, {"id": 103, "start": 1458486, "speaker": "David Kaufer", "stamp": "00:24:18", "text": "And she didn't think it was and she didn't think it was I wanna say weird, you know, but different. She didn't think anything about reading the way that she wrote read, for example. Like that was just the way it was. I you just, you know, cover up one eye and roll over and do the other eye. And that's just the yeah, that's just what you do. Yep. So what role does neuroplasticity play in vision? I mean, what you know, when it comes to this, like you said, it's not just twenty you know, looking twenty Are there"}, {"id": 104, "start": 1468589, "speaker": "Elizabeth Zielinski", "stamp": "00:24:28", "text": "Hello."}, {"id": 105, "start": 1473642, "speaker": "Elizabeth Zielinski", "stamp": "00:24:33", "text": "Exactly."}, {"id": 106, "start": 1487244, "speaker": "David Kaufer", "stamp": "00:24:47", "text": "Are the ther is vision therapy, does that deal with issues with the brain in terms of training the brain as well?"}, {"id": 107, "start": 1494006, "speaker": "Elizabeth Zielinski", "stamp": "00:24:54", "text": "That's exactly what it's doing. Yeah. Okay. We're training the brain to see correctly. Cause the eyes themselves are just an organ, right? They the muscles are not gonna do anything you don't tell 'em to do. So if the brain isn't telling the eyes what to do, you're not gonna see properly."}, {"id": 108, "start": 1515574, "speaker": "Elizabeth Zielinski", "stamp": "00:25:15", "text": "Regardless, you know, it real vision really is just in the brain and we don't think of it that way. We think it's what our eyes are seeing, you know. But I mean our arms aren't gonna move if our brain doesn't tell it to. So why do we think our eyes know what to do if our brain doesn't tell 'em what to do?"}, {"id": 109, "start": 1531308, "speaker": "David Kaufer", "stamp": "00:25:31", "text": "Why do we think that, Denise? That's a good question. I mean th that 'cause it's true. That's a absolutely the perception. You don't think of it as a muscle, you don't think of it as something that your brain has to control. I guess unless you're really in a situation when you that kind of focus is required."}, {"id": 110, "start": 1552896, "speaker": "David Kaufer", "stamp": "00:25:52", "text": "Anything from like looking through a microscope or binoculars or you know, whatever where you're like, Oh, you know, you're actually focused on the task at hand, I guess. You just take it for granted? I mean"}, {"id": 111, "start": 1563886, "speaker": "Elizabeth Zielinski", "stamp": "00:26:03", "text": "We all take it for granted all the time. And Yeah."}, {"id": 112, "start": 1568014, "speaker": "David Kaufer", "stamp": "00:26:08", "text": "Do you Yeah. Go ahead. Kind of like walking. Again, you do you take advan you take it for granted if you're able to walk. Right. If you've gone through that progression, you know, that's all you know. You learn to crawl, you learn to walk. You want to go from point A to point B, you walk there. You don't think about your brains telling your legs to move. I guess it's the same for vision."}, {"id": 113, "start": 1591054, "speaker": "Elizabeth Zielinski", "stamp": "00:26:31", "text": "Exactly."}, {"id": 114, "start": 1594974, "speaker": "Elizabeth Zielinski", "stamp": "00:26:34", "text": "And if our eye muscles aren't working properly, it's no different than any other muscle in our body, you know, and we do exercise to strengthen those muscles or to relax those muscles, right? And in the case of our eyes, we really need to relax the muscles in order for them to see properly. And we never think of it that way either, you know."}, {"id": 115, "start": 1617944, "speaker": "David Kaufer", "stamp": "00:26:57", "text": "No, not at all. I mean you're starting to see some awareness in terms of eyes. I'm thinking about like with eye fatigue now with all the screen time, you know, things kind of related to that. Hey, you need to give your eyes a break. You know, you don't want to be staring at a screen for hours on end and all that. But I still feel like it's fairly shallow in terms of the approach that we take."}, {"id": 116, "start": 1642763, "speaker": "Elizabeth Zielinski", "stamp": "00:27:22", "text": "I agree. Absolutely. Yep."}, {"id": 117, "start": 1648298, "speaker": "David Kaufer", "stamp": "00:27:28", "text": "yeah, I was thinking also with especially with kids and screen time and you know, this all overlaps, but could some you know, could these problems sometimes l look like ADHD or learning disabilities or sensory issues?"}, {"id": 118, "start": 1663774, "speaker": "Elizabeth Zielinski", "stamp": "00:27:43", "text": "Absolutely. Yeah. And the fact that we see it in this population should point that out a little bit. You know, if the same kids that are struggling are the ones who have a vision problem, then w you know, which came first? And what's the best way to deal with it, right? And you know, I have another favorite book that I wanted to share."}, {"id": 119, "start": 1690892, "speaker": "David Kaufer", "stamp": "00:28:10", "text": "Yeah, I'm pleased."}, {"id": 120, "start": 1692088, "speaker": "Elizabeth Zielinski", "stamp": "00:28:12", "text": "There's well, there's a couple that were written by Robin and Gillian Benoit. One of them's called Jillian's Story. And then I have this one as Dear Jillian. And they talk in this book about well, in the first one, she tells Jillian's story. And Jillian had amblyopia. she had passed every eye exam. And the way she passed it, and I don't know if you know what amblyopia is or if you're"}, {"id": 121, "start": 1719086, "speaker": "David Kaufer", "stamp": "00:28:39", "text": "I do not"}, {"id": 122, "start": 1720118, "speaker": "Elizabeth Zielinski", "stamp": "00:28:40", "text": "Okay. Well s it's a type of strabismus. Amblyopia you have lower acuity in one eye. So if you can't see very well out of one eye, you're just gonna use the other eye. And that eye just kind of shuts off. And it sometimes if that happens for a long period of time, the person really goes blind in that eye. And it just kinda becomes they treat it as a permanent kind of problem. I don't agree that any of that's permanent, but"}, {"id": 123, "start": 1750050, "speaker": "Elizabeth Zielinski", "stamp": "00:29:10", "text": "There's different perceptions on that. Anyway, Jillian had pretty significant amblyopia, but she'd passed every test when they've done the eye exam at the school because she thought it was like a memorization test. And so she would listen to the kids in front of her and she wanted to get the treat, right? And so she would just rattle off whatever they said, even though she couldn't see it at all."}, {"id": 124, "start": 1774978, "speaker": "David Kaufer", "stamp": "00:29:34", "text": "Wow. That's I mean it's ingenious, but again not helpful in term"}, {"id": 125, "start": 1780246, "speaker": "Elizabeth Zielinski", "stamp": "00:29:40", "text": "Exactly. Yeah. And so when she finally got into vision therapy, then, you know, she was able to overcome that and gain 3D vision and then tell her story, you know. And then all these people started writing to her saying, Hey, let me tell you my story. And that's what went into the second book, right? And she did talk to someone that was autistic. Their family. Right."}, {"id": 126, "start": 1804695, "speaker": "David Kaufer", "stamp": "00:30:04", "text": "Oh interesting."}, {"id": 127, "start": 1806582, "speaker": "Elizabeth Zielinski", "stamp": "00:30:06", "text": "And that's why I wanted to share this because I think it this is a really great story about it. he this child was only two when they figured out that he well he was diagnosed as autistic, but then they figured out that he also had an eye issue that could be helped with vision therapy. So they took him to vision therapy and he was able to progress so much that he"}, {"id": 128, "start": 1833846, "speaker": "Elizabeth Zielinski", "stamp": "00:30:33", "text": "graduated from the autistic program that he was in with the school system. They said he doesn't qualify as being autistic anymore. So I think that that's just kind of points to the fact that there's so much more going on."}, {"id": 129, "start": 1840842, "speaker": "David Kaufer", "stamp": "00:30:40", "text": "Interesting. Yeah."}, {"id": 130, "start": 1849790, "speaker": "David Kaufer", "stamp": "00:30:49", "text": "So much more going on. Absolutely."}, {"id": 131, "start": 1852524, "speaker": "Elizabeth Zielinski", "stamp": "00:30:52", "text": "And we c we can we can look at the symptoms and say, well, it's gotta be this, but that may not be the case, you know. And so there's a lot of misdiagnosis of ADHD and dyslexia and all of those learning issues that we really should check the vision to see if that's what's causing the problem, or if it can help the problem. It's all working together."}, {"id": 132, "start": 1877281, "speaker": "David Kaufer", "stamp": "00:31:17", "text": "Right, for sure."}, {"id": 133, "start": 1881342, "speaker": "David Kaufer", "stamp": "00:31:21", "text": "And it seems that there is not a big emphasis on vision screening, really. I mean it kind of it's almost like kind of a last resort. And do you think again, is that lack of awareness, Denise, or is it just resources? I mean what how what would you attribute or would you"}, {"id": 134, "start": 1900834, "speaker": "Elizabeth Zielinski", "stamp": "00:31:40", "text": "There's so much that goes into that's such a loaded question. I had I had to remove myself from the school system because it was such a hot topic for me personally. Because I wanted to go in there and I wanted to tell every parent, you know what, if your child is struggling in school, you need to take them to a developmental optometrist, not a regular optometrist. Right."}, {"id": 135, "start": 1904290, "speaker": "David Kaufer", "stamp": "00:31:44", "text": "Okay, it's"}, {"id": 136, "start": 1927244, "speaker": "Elizabeth Zielinski", "stamp": "00:32:07", "text": "Those guys tell you everything's fine your whole life. That's what happened for me. That's what happened to my daughter. I specifically asked my optimetrist if she had a problem with depth perception. And he told me she was fine. So you can't even get this kind of a diagnosis at a regular doctor's office. And they're not gonna screen for it in a school system, right? They're only screening for acuity, you know, at the eye chart across the room. There are things they can do."}, {"id": 137, "start": 1956142, "speaker": "Elizabeth Zielinski", "stamp": "00:32:36", "text": "that are not that hard, but they're not equipped all the time to do it. And what I found when I said, you know, I really want to tell this parent that they should take their child to their per correct eye doctor, the school system said, You can't tell them."}, {"id": 138, "start": 1973590, "speaker": "David Kaufer", "stamp": "00:32:53", "text": "Why what? Why not?"}, {"id": 139, "start": 1975798, "speaker": "Elizabeth Zielinski", "stamp": "00:32:55", "text": "Because the school doesn't want to have to pay for vision therapy."}, {"id": 140, "start": 1979858, "speaker": "David Kaufer", "stamp": "00:32:59", "text": "Yeah. Comes if it comes down to finances."}, {"id": 141, "start": 1984332, "speaker": "David Kaufer", "stamp": "00:33:04", "text": "So they don't they don't they aren't even questioning I'm drawing a parallel because in terms of like in the non speaking world the there are issues with schools not allowing the use of letterboards or communication partners in there. And again, part of it's financial, part of it in this case is also"}, {"id": 142, "start": 2006616, "speaker": "David Kaufer", "stamp": "00:33:26", "text": "claims that, you know, it's not effective. I mean they there's a lot of other excuses they use in this. But I was curious, so with this though, you think it's purely financial are do they don't even they don't care if it's effective or not. They just care about the cost."}, {"id": 143, "start": 2022074, "speaker": "Elizabeth Zielinski", "stamp": "00:33:42", "text": "Well, they're not trained to do it and they're they don't have the funds to pay f for, you know, a developmental optometrist to do it."}, {"id": 144, "start": 2031320, "speaker": "David Kaufer", "stamp": "00:33:51", "text": "But they can still recommend it, couldn't they? I mean, couldn't they at least or educate I don't see the harm in at least I understand them saying, hey, we can't provide this necessarily if this is an additional cost, additional burden. I mean, I know financially, right? I mean, our we ask a lot of our schools and s and stuff, and that's a another topic, but I can at least understand that from a financial standpoint, if that's just an additional cost to burden. But to at least say, hey, here's something you should look at."}, {"id": 145, "start": 2062358, "speaker": "Elizabeth Zielinski", "stamp": "00:34:22", "text": "I think it's a big problem. Yeah. That's why I'm saying I had to just not be in education. You know? And that kind of pointed me towards what I ended up doing, right? At the end of the day, that's why I'm doing podcasting because we need awareness."}, {"id": 146, "start": 2082999, "speaker": "David Kaufer", "stamp": "00:34:42", "text": "So that really what that really did just kinda cause you were teaching, right? You were substantial."}, {"id": 147, "start": 2087840, "speaker": "Elizabeth Zielinski", "stamp": "00:34:47", "text": "I was substituting yeah I it"}, {"id": 148, "start": 2094666, "speaker": "Elizabeth Zielinski", "stamp": "00:34:54", "text": "Yeah, no, in the meantime I had to find something that was gonna pay the bills. Right. So instead of going the route of alternative l route to licensure and getting a teaching certificate and being in the school system, I got my insurance license. I sold insurance for ten years. Finished raising my children and all of that. And in the meantime, you know, that gave me flexibility to focus on my own healing, to do my vision therapy, to get my child in."}, {"id": 149, "start": 2124826, "speaker": "Elizabeth Zielinski", "stamp": "00:35:24", "text": "And you know, get all of that handled, get them all married off. And then that's good. then I was able to spend more time on my podcast."}, {"id": 150, "start": 2130284, "speaker": "David Kaufer", "stamp": "00:35:30", "text": "Ha"}, {"id": 151, "start": 2137186, "speaker": "David Kaufer", "stamp": "00:35:37", "text": "And how and remind me how long you've been doing your podcast?"}, {"id": 152, "start": 2141942, "speaker": "Elizabeth Zielinski", "stamp": "00:35:41", "text": "I started it in twenty about the time."}, {"id": 153, "start": 2145048, "speaker": "David Kaufer", "stamp": "00:35:45", "text": "Wow, good for you. Wow. That's amazing."}, {"id": 154, "start": 2148428, "speaker": "Elizabeth Zielinski", "stamp": "00:35:48", "text": "Yeah, well, and I started it before I had everybody out of the house and there were some downtimes. You know, I think every podcaster gets to the point where they're questioning whether they're able to continue, right? And my point in time happened when I had three daughters get married in the space of four months in the summer of twenty one. I blame that on COVID."}, {"id": 155, "start": 2175160, "speaker": "David Kaufer", "stamp": "00:36:15", "text": "COVID marriages."}, {"id": 156, "start": 2176952, "speaker": "Elizabeth Zielinski", "stamp": "00:36:16", "text": "Well, they were all dating from the dating apps and stuff, you know? And they all"}, {"id": 157, "start": 2182742, "speaker": "David Kaufer", "stamp": "00:36:22", "text": "Yeah, plan that a little bit, spread it out a little bit for your sake? I mean, geez, that's a lot."}, {"id": 158, "start": 2188524, "speaker": "Elizabeth Zielinski", "stamp": "00:36:28", "text": "You would think. Yeah. So that happened and I had my third daughter get married by September of that year. And then the f and I had one podcast come out that year, you know, in that summer. Yeah. And then I had some technical issues and I just let life get to me, you know, the whole now I'm an empty nester, what's my life look like? And then in April of twenty two my I actually lost my husband in a motorcycle accident. Oh"}, {"id": 159, "start": 2218570, "speaker": "Elizabeth Zielinski", "stamp": "00:36:58", "text": "And so that kind of shut me down as a podcaster too, you know. So people look at my dates on my podcast, there's this huge gap in there, you know. Oh I finally had to just say, you know what, this is why I'm still here, part of why I'm still here, you know, is because I still have work to do. I mean, there's a reason why he had to go and I had to stay, you know. So I got back into it."}, {"id": 160, "start": 2229694, "speaker": "David Kaufer", "stamp": "00:37:09", "text": "Well understandably."}, {"id": 161, "start": 2250124, "speaker": "David Kaufer", "stamp": "00:37:30", "text": "What are some of the lessons you've learned? I'm curious from podcasting, first of all, and some of the guests that you've had on there. What have what are or what are a couple of maybe surprising things that have come from it, that journey?"}, {"id": 162, "start": 2265548, "speaker": "Elizabeth Zielinski", "stamp": "00:37:45", "text": "Surprising is a good question. I started to see how the whole body fits into the picture. If we look at it just from the eye standpoint, we limit ourselves, you know? And if we look at it from a whole body perspective, then we can say, okay, what is the real cause of this problem? Is there an alignment problem in the body that we can look at?"}, {"id": 163, "start": 2275136, "speaker": "David Kaufer", "stamp": "00:37:55", "text": "Yes."}, {"id": 164, "start": 2295064, "speaker": "Elizabeth Zielinski", "stamp": "00:38:15", "text": "that will help us along the way or that is signaling that there's something going on with the eyes even. I for this is a great example of my from my own life. I was born pigeon toed. So we already have a misalignment, right? The way they handled that back in my day, since I'm so old, is that they would put casts on your on the baby's feet."}, {"id": 165, "start": 2320387, "speaker": "David Kaufer", "stamp": "00:38:40", "text": "I remember hearing about that."}, {"id": 166, "start": 2322466, "speaker": "Elizabeth Zielinski", "stamp": "00:38:42", "text": "for like six weeks. And then after the cast comes off, then they put a bar with two with the orthopedic shoes, right? And the shoes are pointing out and you have to wear that and most of the time, you know. I remember it being during naps and stuff, you know. Like it was it was a thing that well, I had to do it with my oldest daughter too. Like I my daughter had the same problem. So I know."}, {"id": 167, "start": 2351298, "speaker": "Elizabeth Zielinski", "stamp": "00:39:11", "text": "So there's that misalignment that I think you should pay attention to, you know, because it the body's telling us something, right? It's telling us that we need to pay attention to what's going on as far as oh I take it I personally I take it back to feelings too, but with my guests I have talked with them about the fact that there's misalignments in the body that we could address as well."}, {"id": 168, "start": 2380960, "speaker": "Elizabeth Zielinski", "stamp": "00:39:40", "text": "So it's kind of a long answer. I don't know if that gives you"}, {"id": 169, "start": 2385814, "speaker": "David Kaufer", "stamp": "00:39:45", "text": "It does. Yeah. No, I no, I'm just kinda thinking as you're talking, about that. You know, the whole body approach. I th I think it makes so much sense. And I think it's something that we've continued to learn about, you know, as people in the medical profession. It's kind of getting back to what you said earlier. It's kind of funny. You can we start w the topic was talking about kind of the vision therapy and then of course"}, {"id": 170, "start": 2413484, "speaker": "David Kaufer", "stamp": "00:40:13", "text": "You think about just the eyes, right? This is just a you know has to and we and we do that with our body, right? It's just and in healthcare in general. Just one thing. Oh, you have a problem with headaches or whatever. So it's just, you know, it's a it's a headache problem. And you know, where could we find out later it could be something related to a spine issue, you know, a misalignment that's everything's to your point."}, {"id": 171, "start": 2441396, "speaker": "David Kaufer", "stamp": "00:40:41", "text": "Everything is so much more connected than I think we're taught or realize or assume or whatever. I'm you know, I'm again I'm not sure. It's kind of like one of those systemic things. And I'm sure I think some of it's probably just kind of the you know, traditional healthcare approach that specialists in our age of specialists, you kind of choose especially and so right. I don't know. And they don't talk right."}, {"id": 172, "start": 2465014, "speaker": "Elizabeth Zielinski", "stamp": "00:41:05", "text": "And they don't talk to each other. And in our world today with vision even, the ophthalmologists and the vision therapy doctors don't typically talk to each other either, which I think is malpractice, honestly, because there's so much good that can be done when they collaborate. You know, if I hadn't had vision therapy, surgery, and more vision therapy, I would not have gained three D vision."}, {"id": 173, "start": 2494455, "speaker": "David Kaufer", "stamp": "00:41:34", "text": "Right."}, {"id": 174, "start": 2495288, "speaker": "Elizabeth Zielinski", "stamp": "00:41:35", "text": "But there's so few doctors that work together. You know, and if you go in and you only have the surgery, the percentage of success isn't even being measured. If you want if you want the result to be three D vision, they're only measuring whether the eyes are aligned. So it th they consider it a 'cause cosmetic surgery."}, {"id": 175, "start": 2516884, "speaker": "David Kaufer", "stamp": "00:41:56", "text": "Right. That makes sense. Wow. Why don't they talk more? Is it ego? Is it just is I mean, is there is it is it a turf battle? I mean, I honestly don't know. I mean again we see this in other areas, right? I mean I I'm drawing analogies to you know the world I'm most familiar with in the autism world, but in this world, what do you see, Denise?"}, {"id": 176, "start": 2541827, "speaker": "Elizabeth Zielinski", "stamp": "00:42:21", "text": "I think it's an ego problem personally, you know. I think they're so t caught up in where's the scientific proof, you know? Well who's gonna do these studies that prove that you're gaining three D vision, you know? It's"}, {"id": 177, "start": 2560418, "speaker": "David Kaufer", "stamp": "00:42:40", "text": "So that's is that kind of their"}, {"id": 178, "start": 2563586, "speaker": "Elizabeth Zielinski", "stamp": "00:42:43", "text": "Yeah, that they'll say there's no studies that prove it works. Well, there's all kinds of people who can say, look, this worked for me, you know, but everyone's problem is so specific. Doing double blind studies doesn't even work. I mean, there's how would you even do a study like that? You can't find people whose situation is exactly the same, no one's is. So you can't do a study on it."}, {"id": 179, "start": 2581246, "speaker": "David Kaufer", "stamp": "00:43:01", "text": "How would we right."}, {"id": 180, "start": 2590776, "speaker": "David Kaufer", "stamp": "00:43:10", "text": "That is so interesting. and again, that I was just gonna say, Denise, that's the connection. That's exact because that's exactly the battle that parents and you know non speakers are fighting as well in our world. And when talking about the world of letterboards and you know, we call it spelling to communicate and all this, the establishment, in this case the speech and hearing association, therapist association."}, {"id": 181, "start": 2617486, "speaker": "David Kaufer", "stamp": "00:43:37", "text": "They use the exact same argument. There's no s you know, this isn't scientific. There's no scientific proof. And the response is, you know, the proof is in what you're seeing. I mean, people are using it successfully. And it sounds very similar to what you're saying with vision therapy. So it sounds like kind of traditional I eye doctors see vision therapy as I don't know, is do they see it as like woo-woo sort or kind of"}, {"id": 182, "start": 2646826, "speaker": "Elizabeth Zielinski", "stamp": "00:44:06", "text": "Yeah, I think they do. there's so many times that they just say, Oh, it doesn't work, or you're not a candidate, or they don't even mention it to someone who's been in for vis for eye surgery. They'll say, Well, this surgery might not work, you might need another one. I mean, I'm on these support groups for Strubismus on Facebook and it's a constant thing."}, {"id": 183, "start": 2672875, "speaker": "David Kaufer", "stamp": "00:44:32", "text": "Wow."}, {"id": 184, "start": 2673634, "speaker": "Elizabeth Zielinski", "stamp": "00:44:33", "text": "They just they don't tell him about it."}, {"id": 185, "start": 2676844, "speaker": "David Kaufer", "stamp": "00:44:36", "text": "Yeah, that's like I said, that's that blows me away in a way, again the parallels that we see. And you don't you don't know what you don't know. So going back 'cause you know, one of the c obvious questions would be, Denise, is for parents, what should they be looking for? I mean, if your if your eye doctor's not gonna give you a heads up, like, hey, here's you know, here's something to look for, if they're not gonna steer you to vision therapy or you know, some of these other you know"}, {"id": 186, "start": 2705624, "speaker": "David Kaufer", "stamp": "00:45:05", "text": "Treatments? What should the parents be looking for?"}, {"id": 187, "start": 2709484, "speaker": "Elizabeth Zielinski", "stamp": "00:45:09", "text": "Well, I kind of alluded to it a little bit with what I mentioned about my daughter's story. You know, th asking those specific questions if your child is verbal and can tell you, right? Obviously it's way harder if your child's not verbal and they can't tell you, but I have a little checklist that I made for parents. Again, it's gonna it's gonna be a little harder depending on your child. But if they're"}, {"id": 188, "start": 2738062, "speaker": "David Kaufer", "stamp": "00:45:38", "text": "But no, it's is it on your website or do you do you have that I want to hear it?"}, {"id": 189, "start": 2741482, "speaker": "Elizabeth Zielinski", "stamp": "00:45:41", "text": "Yeah, and I can go I can go over the short list. It's a very yeah, so they lose place or skip lines or reread something and when they're reading. they avoid reading or they get frustrated really quickly. they would understand better when they're listening than when they're reading. They have a short attention span for schoolwork, but if they have a preferred activity, their attention span is long."}, {"id": 190, "start": 2771812, "speaker": "Elizabeth Zielinski", "stamp": "00:46:11", "text": "they get tired or emotional or overwhelmed during learning tasks."}, {"id": 191, "start": 2777002, "speaker": "David Kaufer", "stamp": "00:46:17", "text": "Right."}, {"id": 192, "start": 2777880, "speaker": "Elizabeth Zielinski", "stamp": "00:46:17", "text": "They're clumsy like I was. They bump into things or they struggle with coordination. anytime you've been told everything is fine and you still have concerns, that's the time to go and have it checked out, you know. But the thing is that a regular optometrist or an ophthalmologist is not gonna look for the same kinds of things as a developmental optometrist will look for."}, {"id": 193, "start": 2802806, "speaker": "David Kaufer", "stamp": "00:46:42", "text": "Right."}, {"id": 194, "start": 2803938, "speaker": "Elizabeth Zielinski", "stamp": "00:46:43", "text": "So you really have to go to the right doctor."}, {"id": 195, "start": 2807614, "speaker": "David Kaufer", "stamp": "00:46:47", "text": "That makes a lot of sense now. And this is kind of this may be kind of a dumb question, but can if your child has, you know, this type of vision and w I mean, would they still be able to appear normal, yeah, but they have normal vision in other ways, like playing video games or things like that. Is that affected?"}, {"id": 196, "start": 2829524, "speaker": "Elizabeth Zielinski", "stamp": "00:47:09", "text": "Yeah, I mean a video game isn't gonna have a depth perception requirement."}, {"id": 197, "start": 2834360, "speaker": "David Kaufer", "stamp": "00:47:14", "text": "So that's easy that's easier 'cause it's not okay."}, {"id": 198, "start": 2836930, "speaker": "Elizabeth Zielinski", "stamp": "00:47:16", "text": "Yeah. I mean it's in two D most of the time, you know, unless you're playing with the VR headset. Which actually a lot of vision therapy doctors are starting to use the VR."}, {"id": 199, "start": 2851894, "speaker": "David Kaufer", "stamp": "00:47:31", "text": "I was wondering about that, if that would be helpful with that."}, {"id": 200, "start": 2856044, "speaker": "Elizabeth Zielinski", "stamp": "00:47:36", "text": "Yeah, I actually even have one and I I've been so anti-video games that I can't make myself do it, but I bought one and I was like, I'm gonna do this. And I haven't. But it is something that a lot of patients find very helpful."}, {"id": 201, "start": 2871392, "speaker": "David Kaufer", "stamp": "00:47:51", "text": "Yeah, no, you've just you've got me thinking in terms of and I'm just thinking, are there are there any other questions that you can ask your child again that maybe aren't reading related or things I'm thinking about again, our audience who maybe have non-speakers but can communicate through typing. are there any other side things that they can ask or ways to try to determine if this is a problem or a potential problem or issue?"}, {"id": 202, "start": 2897080, "speaker": "Elizabeth Zielinski", "stamp": "00:48:17", "text": "This things I'm seeing in on these checklists are gonna have to do with being able to keep your place, you know. So the hand eye coordination piece could apply to nonverbal, you know, if they if they have a hard time even picking something up or catching or whatever, right? That's a high hand eye coordination issue. I remember Gillian saying that she used to stick out her pinky when she was grabbing the cup."}, {"id": 203, "start": 2925698, "speaker": "Elizabeth Zielinski", "stamp": "00:48:45", "text": "You know, because it helped her orient where her hand was gonna go. oh You would see compensations in that hand eye coordination piece."}, {"id": 204, "start": 2928564, "speaker": "David Kaufer", "stamp": "00:48:48", "text": "Where her hand was, yeah."}, {"id": 205, "start": 2937805, "speaker": "David Kaufer", "stamp": "00:48:57", "text": "Okay."}, {"id": 206, "start": 2940376, "speaker": "David Kaufer", "stamp": "00:49:00", "text": "Great. Well, let's move on to our weekly segments because I know that you are prepared. Thank you, Denise, for coming prepared. yeah. And so we're gonna start off and for each of these, just give you fair warning, we do have little jingles that will that Dave, producer Dave will play and then we'll get we'll start off with the tip of the week. It won't necessarily be autism tip of the week, but it'll be Denise's tip of the week."}, {"id": 207, "start": 2967478, "speaker": "Elizabeth Zielinski", "stamp": "00:49:27", "text": "Hey parents, gather round, it's time to speak We're here with your tip of the week Strategies and wisdom just for you Autism parents, we know what you go through"}, {"id": 208, "start": 2984926, "speaker": "David Kaufer", "stamp": "00:49:44", "text": "All right, it's time for our tip of the week. And as I mentioned earlier, I know that Denise, you brought one for us. What do you have?"}, {"id": 209, "start": 2993656, "speaker": "Elizabeth Zielinski", "stamp": "00:49:53", "text": "Well, we've kind of talked about it a little bit already, but just pointing to the fact that a child may be able to see clearly and still have difficulty using their two eyes together, and a regular vision screening, even at a doctor's office, may not tell the whole story."}, {"id": 210, "start": 3011648, "speaker": "David Kaufer", "stamp": "00:50:11", "text": "Okay, that's a great that's a great tip. and I was gonna ask kind of a related tip, if every parent could know one thing about binocular vision, what would it be?"}, {"id": 211, "start": 3026274, "speaker": "Elizabeth Zielinski", "stamp": "00:50:26", "text": "Well, not everyone has it. Okay. You know. Yeah. It I think we just take that for granted. not just as a parent, but as a as a person alive on the earth today, we just think everyone sees like we do."}, {"id": 212, "start": 3040960, "speaker": "David Kaufer", "stamp": "00:50:40", "text": "Yeah, right. You just assume that."}, {"id": 213, "start": 3043796, "speaker": "Elizabeth Zielinski", "stamp": "00:50:43", "text": "I've talked to so many people they don't even know what binocular vision means. They and I there I say, Well, I didn't see in three D before and they say, Well, do I see in three D? I said, Well, probably. I don't know. I can't see like you do."}, {"id": 214, "start": 3057112, "speaker": "David Kaufer", "stamp": "00:50:57", "text": "I don't think."}, {"id": 215, "start": 3061024, "speaker": "David Kaufer", "stamp": "00:51:01", "text": "Yeah, that's funny. All right. Next up we have factor fiction. Time ready, and here we go. This is autism factor fiction. We're breaking down what's real, what's rumored, and what might surprise you. Let's go. All right. So this is again where I like to introduce potential stereotypes or myths or, you know, things that may misperspe misperceptions that may be out there. But"}, {"id": 216, "start": 3067249, "speaker": "Elizabeth Zielinski", "stamp": "00:51:07", "text": "oh"}, {"id": 217, "start": 3090654, "speaker": "David Kaufer", "stamp": "00:51:30", "text": "Denise, what do you have for fact or fiction?"}, {"id": 218, "start": 3093218, "speaker": "Elizabeth Zielinski", "stamp": "00:51:33", "text": "Well, again, we've talked about a lot of this, so I'm kind of feeling like maybe this is just a review. the fact or fiction that I chose was twenty means that your vision is fine."}, {"id": 219, "start": 3110368, "speaker": "David Kaufer", "stamp": "00:51:50", "text": "Right. I think that's a big one though. I think that bears repeating because I think that's such a that it that I think that's just presumed to be fact. I think that's just so ingrained in us that that's the goal. It's just all about twenty vision that you don't even don't even think about that."}, {"id": 220, "start": 3129260, "speaker": "Elizabeth Zielinski", "stamp": "00:52:09", "text": "Right. And because my gl my glasses corrected my vision so that it was twenty I must be fine. Right."}, {"id": 221, "start": 3138975, "speaker": "David Kaufer", "stamp": "00:52:18", "text": "Yeah. And I guess kind of related to that would be, you know, I'd jotted down, you know, like my child passed their vision screening, you know, at school. So I'm everything's fine. That yeah. That true."}, {"id": 222, "start": 3152822, "speaker": "Elizabeth Zielinski", "stamp": "00:52:32", "text": "And being told that you're fine for years and years and years. And knowing that you're not really."}, {"id": 223, "start": 3161142, "speaker": "David Kaufer", "stamp": "00:52:41", "text": "I mean there's a little bit of trauma that goes with that, right? I mean kinda isn't it a little bit of being like gaslit for so many years? Like you're like, I know this isn't true, but I can't prove it."}, {"id": 224, "start": 3172418, "speaker": "Elizabeth Zielinski", "stamp": "00:52:52", "text": "Yes, and I've heard it from many of my guests as well."}, {"id": 225, "start": 3177876, "speaker": "David Kaufer", "stamp": "00:52:57", "text": "That they knew that they knew something was wrong, but"}, {"id": 226, "start": 3181718, "speaker": "Elizabeth Zielinski", "stamp": "00:53:01", "text": "Yeah, and one in particular had the strabismus surgery and went back to her surgeon and said, You know, I'm really struggling. She had a complete breakdown of her visual system after her surgery. You know, you move the eyes around, she's used to compensating a certain way. And her eyes had no idea what to do at that point. And this was a while after the surgery that she had this complete breakdown. And they treated her like she was crazy, like she should just"}, {"id": 227, "start": 3211202, "speaker": "Elizabeth Zielinski", "stamp": "00:53:31", "text": "But they literally said, it's all in your head."}, {"id": 228, "start": 3215637, "speaker": "David Kaufer", "stamp": "00:53:35", "text": "Unbelievable."}, {"id": 229, "start": 3217000, "speaker": "Elizabeth Zielinski", "stamp": "00:53:37", "text": "It was all into her head because it was her brain not knowing how to tell her how to work together. Right."}, {"id": 230, "start": 3223575, "speaker": "David Kaufer", "stamp": "00:53:43", "text": "Right, No, I go back to li the point you made w right off the bat, Denise, in terms of how our eyes are muscles and if you're gonna have surgery on a muscle, it's just like anything else. Like I can't imagine someone who goes through, say, you know, again, sports related that people relate, you know, can go through ACL surgery and just like you just have surgery and then say, Okay, you're good to go."}, {"id": 231, "start": 3248928, "speaker": "David Kaufer", "stamp": "00:54:08", "text": "Without PT, right? Without any type of follow up. I mean, it sounds like that's kind of the expectation with eye the eye surgery."}, {"id": 232, "start": 3257854, "speaker": "Elizabeth Zielinski", "stamp": "00:54:17", "text": "It is. Yeah. And that's actually one of my favorite analogies. You would never have surgery on any other part of your body and not have physical therapy surgery or after surgery or both. Right. And yet that's what we are doing all the time with vision with our eyes with our eye surgery."}, {"id": 233, "start": 3266627, "speaker": "David Kaufer", "stamp": "00:54:26", "text": "Yeah."}, {"id": 234, "start": 3277112, "speaker": "David Kaufer", "stamp": "00:54:37", "text": "That's crazy. Sorry. That's that really is crazy. I mean, that's just I guess it just seems yeah. It seems like there's we need to progress the view there. Like in as we have in so many other areas of medicine and healthcare. I'll put it that way. Saying it's just crazy isn't very productive."}, {"id": 235, "start": 3298252, "speaker": "Elizabeth Zielinski", "stamp": "00:54:58", "text": "Well, it's not but the a awareness is what we're trying to do so that people will know that there needs to be a ship. You know, it we ha we have to demand it of the doctors."}, {"id": 236, "start": 3308620, "speaker": "David Kaufer", "stamp": "00:55:08", "text": "Right. Yeah. And that's yeah, and that that's kind of like a whole nother conversation, right, Denise, is changing our mindset. as patients in general, as advocates for our kids, you know, dealing with doctors. trusting them as experts, which they are, they're trained, they're, you know, they have a lot of education and training, which deserves respect. But that doesn't mean they're all known."}, {"id": 237, "start": 3337728, "speaker": "David Kaufer", "stamp": "00:55:37", "text": "all knowing and they and they don't know our bodies. I mean they can't at best a lot of what they're doing is still kind of making educated guesses about the approach, which, you know, that's just the way it works. But"}, {"id": 238, "start": 3352138, "speaker": "Elizabeth Zielinski", "stamp": "00:55:52", "text": "And it's true in the vision therapy room too. They have to figure out where the missing piece is, you know. And you can talk about vision therapy with relation to traumatic brain injury and everything too. And, you know, I've had many of my guests that work with that."}, {"id": 239, "start": 3371064, "speaker": "Elizabeth Zielinski", "stamp": "00:56:11", "text": "population say if you've treated one person with a traumatic brain injury, you've treated one person with a traumatic brain injury, you know. So there's just a lot of things going on with that, you know, and I think some of the autistic population falls into that traumatic brain injury category too, right? And so it's just they're practicing medicine, you know, they're trying to figure it out."}, {"id": 240, "start": 3387021, "speaker": "David Kaufer", "stamp": "00:56:27", "text": "Yeah."}, {"id": 241, "start": 3394060, "speaker": "David Kaufer", "stamp": "00:56:34", "text": "Yeah, for sure. No, I mean it's fascinating. All right. Well, next up on our segment is gonna be our confession of the week, parent confession."}, {"id": 242, "start": 3408428, "speaker": "Elizabeth Zielinski", "stamp": "00:56:48", "text": "Teens can go astray, found socks in the fridge one day. Laughter's the best remedy, hey, we're just finding our own way."}, {"id": 243, "start": 3422446, "speaker": "Elizabeth Zielinski", "stamp": "00:57:02", "text": "Sharing joys and moments we seek, honest tales that make us unique. Join the crowd, we're never meek."}, {"id": 244, "start": 3434292, "speaker": "David Kaufer", "stamp": "00:57:14", "text": "All right, now's the time when we get to, as I always say, share our humanity so that we don't have just have the answers. We've made mistakes too. And Denise, I mean, with six kids, I'm sure there's a couple of things that may have come to mind. But what, yeah, what would you like to share with everyone?"}, {"id": 245, "start": 3452396, "speaker": "Elizabeth Zielinski", "stamp": "00:57:32", "text": "Well, you know, we I already talked about my daughter Abby and how I didn't know that she needed vision therapy till I knew, right? I don't talk about this a lot, but I actually had a another child who had some struggles and still does actually. there's another vision issue called convergence insufficiency. And"}, {"id": 246, "start": 3480490, "speaker": "Elizabeth Zielinski", "stamp": "00:58:00", "text": "My son had been struggling in school. We thought that he was just lazy because he could read, he could do the work. If he did the work, he got a hundred percent, he got an A. If most of the time he didn't do the work, most of the time. And it was not until he was 15 that we had him diagnosed."}, {"id": 247, "start": 3499490, "speaker": "David Kaufer", "stamp": "00:58:19", "text": "Okay."}, {"id": 248, "start": 3509152, "speaker": "Elizabeth Zielinski", "stamp": "00:58:29", "text": "And my doctor said it was probably the worst case of convergence insufficiency he'd ever seen."}, {"id": 249, "start": 3515478, "speaker": "David Kaufer", "stamp": "00:58:35", "text": "What is it? Can you give it a"}, {"id": 250, "start": 3517558, "speaker": "Elizabeth Zielinski", "stamp": "00:58:37", "text": "Convergence insufficiency means that when you try to focus close, your eyes just give up. You can only sustain the convergence, the eyes working together close up for a limited amount of time before it's just too tiring and it it's"}, {"id": 251, "start": 3536202, "speaker": "David Kaufer", "stamp": "00:58:56", "text": "It's like a overload probably, right?"}, {"id": 252, "start": 3538486, "speaker": "Elizabeth Zielinski", "stamp": "00:58:58", "text": "And you just don't want to do it, right? Which is so why he wouldn't focus on his work, you know. Just didn't want to do it because it was so hard to do it. And I did I took him to vision therapy. He did several months of vision therapy, and he was just not really progressing with it, you know. Okay. Yeah. And so, you know, by that age, it's really hard to force them to do it."}, {"id": 253, "start": 3559576, "speaker": "David Kaufer", "stamp": "00:59:19", "text": "Okay."}, {"id": 254, "start": 3568482, "speaker": "David Kaufer", "stamp": "00:59:28", "text": "Sure."}, {"id": 255, "start": 3569190, "speaker": "Elizabeth Zielinski", "stamp": "00:59:29", "text": "And I gave up. That's my big convention actually. I don't I hardly ever talk about it."}, {"id": 256, "start": 3580844, "speaker": "David Kaufer", "stamp": "00:59:40", "text": "Yeah."}, {"id": 257, "start": 3581312, "speaker": "Elizabeth Zielinski", "stamp": "00:59:41", "text": "And it's still I mean, he doesn't if he wants to do something he figures out how to do it. He's very smart. He can do whatever he wants to. But it schoolwork is not it."}, {"id": 258, "start": 3592524, "speaker": "David Kaufer", "stamp": "00:59:52", "text": "He's yeah, he it sounds like he's found other ways of coping and other ways to get things done. But he also knows that option's there, right?"}, {"id": 259, "start": 3601698, "speaker": "Elizabeth Zielinski", "stamp": "01:00:01", "text": "He does. Yeah. And I've told him that many times. You know, you can go back and do the vision therapy and get the results if you want to."}, {"id": 260, "start": 3612130, "speaker": "David Kaufer", "stamp": "01:00:12", "text": "Yeah. Well that I can see where that would be really difficult. But there's only so much that you can do too, right? I mean, that's the part that I think we all struggle with as parents is we you know, we want to be able to control as much as we can. We want to be able to boost our kids and help them. And I was just having that conversation with my brother the other day. It's a it's a really tough balancing act between like is it pushing too hard or you know."}, {"id": 261, "start": 3641986, "speaker": "David Kaufer", "stamp": "01:00:41", "text": "and pulling back too far too. And I the unfortunately there's no there's no perfect answer, right? You just do what you just do what you think is best. But yeah, thank you. Thank you for sharing that. That's I mean I really appreciate that. Well we're gonna turn it around 180 and again because we like to end this on a lighter note. So we have our semi news segment which is light on the spectrum."}, {"id": 262, "start": 3652024, "speaker": "Elizabeth Zielinski", "stamp": "01:00:52", "text": "Yeah."}, {"id": 263, "start": 3668940, "speaker": "Elizabeth Zielinski", "stamp": "01:01:08", "text": "Light on the spectrum, oh a moment, person or story bring in something good. It feels hopeful, grounded, not performative. Use it for a person, a moment, a breakthrough, a story."}, {"id": 264, "start": 3691848, "speaker": "David Kaufer", "stamp": "01:01:31", "text": "All right, so like I said, what do you have for us, Denise, to give our listeners, parents out there, a little bit of hope?"}, {"id": 265, "start": 3700878, "speaker": "Elizabeth Zielinski", "stamp": "01:01:40", "text": "Well, I think that the my story is my biggest gift, right? Because neuroplasticity is a real thing, you know. You don't have to say, Oh, this is just the way it is. And I mean I've heard it so many times. People will say, I have permanent double vision. I will never see in 3D. Happens all the time, you know. And"}, {"id": 266, "start": 3730466, "speaker": "Elizabeth Zielinski", "stamp": "01:02:10", "text": "When I went into my surgeon for my first visit with him and I told him that my goal was to see in 3D, he didn't take that super well, really. You know, he actually told me that he wanted me to come back in and do some more testing because they were getting some new machine in there that was gonna be able to gauge whether I'd be successful, that kind of thing. And I already knew I was gonna be success
