ful. But"}, {"id": 267, "start": 3760584, "speaker": "Elizabeth Zielinski", "stamp": "01:02:40", "text": "He didn't, you know, and so I waited and I went back in and I did their all their s testing and stuff and found out that he actually and I'm it probably shouldn't share, but I knew he knew that he thought that I was being unrealistic."}, {"id": 268, "start": 3777344, "speaker": "David Kaufer", "stamp": "01:02:57", "text": "Right, sure. He's being he's being overly cautious or overly skeptical or you know choose your choose your word, right? I mean."}, {"id": 269, "start": 3787308, "speaker": "Elizabeth Zielinski", "stamp": "01:03:07", "text": "Right. But I mean neuroplasticity says our brains can change, right? The way we see can change, the way we do things can change, we our bodies can improve in many different ways, right? We see that all the time at every age. But yeah. Doesn't matter if you're fifty or seventy or twenty, right? It can change. And so my"}, {"id": 270, "start": 3804758, "speaker": "David Kaufer", "stamp": "01:03:24", "text": "We're out of"}, {"id": 271, "start": 3816088, "speaker": "Elizabeth Zielinski", "stamp": "01:03:36", "text": "gift is that I proven it can change. You know, I gained three D vision at age fifty four."}, {"id": 272, "start": 3823222, "speaker": "David Kaufer", "stamp": "01:03:43", "text": "That's amazing. Yeah, that's a great message. That should give a lot of people hope. And like you said, especially the message about neuroplasticity and just how it can't be emphasized enough because again there's so many contexts where we hear that. like you said, I have permanent XYZ. for those of us like in an autism world, you know, we've dealt with a lot of negativity and we've and now we're seeing a lot of positives."}, {"id": 273, "start": 3851872, "speaker": "David Kaufer", "stamp": "01:04:11", "text": "So before we wrap up, Denise, how can people find you?"}, {"id": 274, "start": 3856768, "speaker": "Elizabeth Zielinski", "stamp": "01:04:16", "text": "Well, I have my podcast on every podcast player. And recently I put it on YouTube. It's got a static image. I don't do video because I'm not that but well I just haven't felt like I could edit a video. I'm good at editing audio. So it but it is on YouTube, it's on all the podcast players, Healing Our Site. I have a Facebook group also called Healing Our Site."}, {"id": 275, "start": 3866894, "speaker": "David Kaufer", "stamp": "01:04:26", "text": "Okay."}, {"id": 276, "start": 3885771, "speaker": "Elizabeth Zielinski", "stamp": "01:04:45", "text": "And website. Healing our site. Awesome. Yeah. So they can reach me in any of those ways."}, {"id": 277, "start": 3894872, "speaker": "David Kaufer", "stamp": "01:04:54", "text": "Great. Well thank you, Denise, for joining us today. I really enjoyed the conversation. I know that our listeners and viewers will walk away looking at a vision."}, {"id": 278, "start": 3904800, "speaker": "David Kaufer", "stamp": "01:05:04", "text": "And eyes, maybe even the brain, a little differently. And thanks to all of you for spending part of your day with us. If you enjoyed today's episode, please subscribe, leave us a review, share it with someone you think would benefit from the conversation. This is one of the best ways to help us reach more families. Continue bringing these important stories to a wider audience. I'd also like to give a special thank you."}, {"id": 279, "start": 3927250, "speaker": "David Kaufer", "stamp": "01:05:27", "text": "To our producer, my guy, Dave Yaz, and the entire team at Pod 617. Dave's been with me since the beginning of our podcast. We're coming up on two years. His expertise, creativity, and friendship have helped make the lighter side of the spectrum what it is today. So again, thank you, Denise, and we'll catch everyone else next week."}];
  const IS_YT = true;
  const WATCH = "https://www.youtube.com/watch?v=_iQycDQNp1k";
  const box = document.getElementById("transcript");
  const search = document.getElementById("search");
  const player = document.getElementById("player");

  function makeSpan(turn, cls, text) {
    const s = document.createElement("span");
    s.className = cls; s.textContent = text; return s;
  }
  TURNS.forEach(turn => {
    const div = document.createElement("div");
    div.className = "turn"; div.dataset.id = turn.id; div.dataset.text = turn.text.toLowerCase();
    const btn = document.createElement("button");
    btn.className = "stamp"; btn.textContent = "[" + turn.stamp + "]";
     btn.addEventListener("click", () => {
       if (IS_YT) { window.open(WATCH + "&t=" + Math.floor(turn.start / 1000) + "s", "_blank"); }
       else if (player) { player.currentTime = turn.start / 1000; player.play(); }
     });
    div.appendChild(btn);
    if (turn.speaker) { const sp = makeSpan(turn, "speaker", turn.speaker + ":"); div.appendChild(sp); }
    div.appendChild(makeSpan(turn, "body", " " + turn.text));
    box.appendChild(div);
  });

  function highlight(div, term) {
    const body = div.querySelector(".body");
    if (!term) { body.textContent = " " + TURNS[div.dataset.id].text; return; }
    const txt = TURNS[div.dataset.id].text;
    const re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    const parts = txt.split(re);
    body.textContent = "";
    parts.forEach(p => {
      if (re.test(p)) { const m = document.createElement("mark"); m.textContent = p; body.appendChild(m); }
      else body.appendChild(document.createTextNode(p));
    });
  }

  search.addEventListener("input", () => {
    const term = search.value.trim().toLowerCase();
    document.querySelectorAll(".turn").forEach(div => {
      const match = !term || div.dataset.text.includes(term);
      div.classList.toggle("hidden", !match);
      if (match) highlight(div, term);
    });
  });

  if (player && !IS_YT) {
    player.addEventListener("timeupdate", () => {
      const t = player.currentTime * 1000;
      let cur = null;
      for (const turn of TURNS) if (turn.start <= t) cur = turn; else break;
      document.querySelectorAll(".turn").forEach(d => d.classList.toggle("active", cur && d.dataset.id == cur.id));
      if (cur) document.querySelector('.turn[data-id="' + cur.id + '"]').scrollIntoView({block: "nearest", behavior: "smooth"});
    });
  }
</script>
</body>
