<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Transcript</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; }
  #search { width: 100%; padding: .6rem .8rem; font-size: 1rem; margin: 1rem 0; box-sizing: border-box; }
  #player { width: 100%; margin: 1rem 0; }
  .hint { color: #888; font-size: .85rem; }
  .turn { padding: .5rem .7rem; border-radius: 6px; line-height: 1.5; }
  .turn:hover { background: rgba(128,128,128,.12); }
  .turn mark { background: #ffe58a; }
  .stamp { background: none; border: 0; color: #2f6fde; cursor: pointer; font: inherit;
           padding: 0; margin-right: .4rem; font-variant-numeric: tabular-nums; }
  .stamp:hover { text-decoration: underline; }
  .speaker { font-weight: 700; margin-right: .3rem; }
  .hidden { display: none; }
  .active { background: rgba(47,111,222,.15); }
</style>
</head>
<body>
  <h1>Interactive Transcript</h1>
  <input id="search" type="search" placeholder="Search the transcript...">
  <iframe id="player" width="100%" height="380" src="https://www.youtube.com/embed/kLDI5z4oyew" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  <div id="transcript"></div>
<script>
  const TURNS = [{"id": 0, "start": 6098, "speaker": "Abdullah Abid", "stamp": "00:00:06", "text": "In this session of the Autism Explained Online Summit, our topic is combining clinical and lived experience with Dave Finch and Dr. Barry Present. So Barry and Dave, what are we talking about in today's session? We're talking about our relationship. So if anybody wants to know about Dave and I working together, especially in our podcast, people should definitely listen in. It'll be fun. It'll be informative."}, {"id": 1, "start": 33292, "speaker": "Abdullah Abid", "stamp": "00:00:33", "text": "Yep, I think it's the theme of this session is going to be complimenting and complementary thoughts and diversity of thought. here we have somebody who is living the experience, me, but very, little academic awareness, knowledge, anything around autism. And kind of marrying that with Dr. Brazant, who is not only a"}, {"id": 2, "start": 62528, "speaker": "Abdullah Abid", "stamp": "00:01:02", "text": "legendary world class academ academician, but has also immersed himself so deeply and is so steeped in the true autistic experience by just his body of work and the people that he chooses to spend his time with and to learn from that it becomes a very rich, nuanced conversation around autism and related topics. So you should check out this session and then you should go listen to our podcast. So that's gonna be a great session. Make sure you check it out."}];
  const IS_YT = true;
  const WATCH = "https://www.youtube.com/watch?v=kLDI5z4oyew";
  const box = document.getElementById("transcript");
  const search = document.getElementById("search");
  const player = document.getElementById("player");

  function makeSpan(turn, cls, text) {
    const s = document.createElement("span");
    s.className = cls; s.textContent = text; return s;
  }
  TURNS.forEach(turn => {
    const div = document.createElement("div");
    div.className = "turn"; div.dataset.id = turn.id; div.dataset.text = turn.text.toLowerCase();
    const btn = document.createElement("button");
    btn.className = "stamp"; btn.textContent = "[" + turn.stamp + "]";
     btn.addEventListener("click", () => {
       if (IS_YT) { window.open(WATCH + "&t=" + Math.floor(turn.start / 1000) + "s", "_blank"); }
       else if (player) { player.currentTime = turn.start / 1000; player.play(); }
     });
    div.appendChild(btn);
    if (turn.speaker) { const sp = makeSpan(turn, "speaker", turn.speaker + ":"); div.appendChild(sp); }
    div.appendChild(makeSpan(turn, "body", " " + turn.text));
    box.appendChild(div);
  });

  function highlight(div, term) {
    const body = div.querySelector(".body");
    if (!term) { body.textContent = " " + TURNS[div.dataset.id].text; return; }
    const txt = TURNS[div.dataset.id].text;
    const re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    const parts = txt.split(re);
    body.textContent = "";
    parts.forEach(p => {
      if (re.test(p)) { const m = document.createElement("mark"); m.textContent = p; body.appendChild(m); }
      else body.appendChild(document.createTextNode(p));
    });
  }

  search.addEventListener("input", () => {
    const term = search.value.trim().toLowerCase();
    document.querySelectorAll(".turn").forEach(div => {
      const match = !term || div.dataset.text.includes(term);
      div.classList.toggle("hidden", !match);
      if (match) highlight(div, term);
    });
  });

  if (player && !IS_YT) {
    player.addEventListener("timeupdate", () => {
      const t = player.currentTime * 1000;
      let cur = null;
      for (const turn of TURNS) if (turn.start <= t) cur = turn; else break;
      document.querySelectorAll(".turn").forEach(d => d.classList.toggle("active", cur && d.dataset.id == cur.id));
      if (cur) document.querySelector('.turn[data-id="' + cur.id + '"]').scrollIntoView({block: "nearest", behavior: "smooth"});
    });
  }
</script>
</body>
</html>
